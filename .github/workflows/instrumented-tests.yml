name: Instrumented tests

on:
  # Only while the workflow is being tried out: workflow_dispatch works only once the file is on the default branch.
  push:
    branches: [claude/kind-bohr-9a9c27]
  workflow_dispatch:
  # Nightly, 04:30 in Minsk; the run stops after the first job when main has no commit from the last 25 hours.
  schedule:
    - cron: '30 1 * * *'

permissions:
  contents: read

concurrency:
  group: instrumented-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  # Must equal android.ndkVersion and the cmake version in nativelib/build.gradle.kts.
  NDK_VERSION: "30.0.16248370"
  CMAKE_VERSION: "3.31.6"
  # The reference fingerprints come from this fpcalc (buildSrc/src/main/kotlin/PrepareFingerprintSamples.kt).
  FPCALC_VERSION: "1.6.2"
  FPCALC_SHA256: "c968ad4a0821592a79b158fb2e1f46cbe0a22a0a1dbc0743c67d68e75d15d2bb"
  # The emulators are x86_64, so the native code need not be built for arm64 as well.
  ABI_ARG: "-Pandroid.injected.build.abi=x86_64"
  EMULATOR_OPTIONS: "-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none"
  # The tests with a time limit: shared runners make their times noisy, so CI leaves them out (notClass syntax).
  # GeneratedLibraryTest skips itself here, since the 20 000-file library is not on the CI emulators.
  EXCLUDED_TESTS: >-
    io.github.lorddetson.piplayer.playback.PlaybackQueueTest#aQueueOf20000SongsStartsWithinASecond,
    io.github.lorddetson.piplayer.playback.QueueNavigationTest#turningShuffleOnInAQueueOf20000SongsIsQuick,
    io.github.lorddetson.piplayer.library.search.LibrarySearchSpikeTest#searchAsYouTypeAnswersWithinFiftyMillisecondsOnThePlatformSqlite

jobs:
  changes:
    name: New commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check for a commit from the last 25 hours
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$EVENT" != schedule ] || [ "$age" -lt 90000 ]; then run=true; else run=false; fi
          echo "Last commit $((age / 3600)) h ago, run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  instrumented:
    name: API ${{ matrix.api-level }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-37.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Install ffmpeg and fpcalc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          NAME="chromaprint-fpcalc-${FPCALC_VERSION}-linux-x86_64"
          curl -fsSL -o "$RUNNER_TEMP/fpcalc.tar.gz" \
            "https://github.com/acoustid/chromaprint/releases/download/v${FPCALC_VERSION}/${NAME}.tar.gz"
          echo "${FPCALC_SHA256}  $RUNNER_TEMP/fpcalc.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/fpcalc.tar.gz" -C "$RUNNER_TEMP"
          echo "FPCALC=$RUNNER_TEMP/$NAME/fpcalc" >> "$GITHUB_ENV"

      # The recordings are CC0 or public domain (nativelib/fingerprint-samples.json); they stay out of git and out of
      # this workflow's artifacts, and the script checks their hashes after every download.
      - name: Restore the fingerprint recordings
        uses: actions/cache@v6
        with:
          path: ~/.cache/piplayer/fingerprint-samples
          key: fingerprint-samples-${{ hashFiles('nativelib/fingerprint-samples.json') }}

      - name: Build the app and its tests
        run: >-
          ./gradlew "$ABI_ARG"
          :app:assembleDebug :app:assembleDebugAndroidTest :nativelib:assembleDebugAndroidTest
          --stacktrace

      - name: Restore the emulator
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api${{ matrix.api-level }}-google_apis-pixel_6-v1

      - name: Create the emulator and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          disk-size: 6144M
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "The snapshot is ready."

      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          disk-size: 6144M
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: bash scripts/ci_instrumented_tests.sh

      - name: Report disk use
        if: always()
        run: |
          echo "::notice title=Disk::$(df -h / | tail -1 | awk '{print $3 " used, " $4 " free"}'); AVD $(du -sh ~/.android/avd 2>/dev/null | cut -f1); recordings $(du -sh ~/.cache/piplayer/fingerprint-samples 2>/dev/null | cut -f1)"

      # No APKs here: the test APKs contain the recordings.
      - name: Upload the test results and logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-api${{ matrix.api-level }}
          path: build/ci-results/
          retention-days: 7
          if-no-files-found: ignore
