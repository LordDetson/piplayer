# Measured on the 16-thread, 15 GB development laptop: a 2 GB Gradle heap made the debug plus release (R8) build 17 to
# 50% slower than 3 GB, so the heaps stay as they are.
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
kotlin.code.style=official
# Several checkouts build at once here; the build cache lets a new worktree or a clean build reuse their outputs.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# An idle daemon holds its 3 GB heap; give it back after 30 minutes instead of the default 3 hours.
org.gradle.daemon.idletimeout=1800000
